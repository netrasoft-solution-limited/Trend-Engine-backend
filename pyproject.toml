[project]
name = "trend-engine"
version = "0.1.0"
description = "Category intelligence and content platform — multi-tenant, operator-in-the-loop"
requires-python = ">=3.12"

# Arch §1 driver #3: operating cost is a hard ceiling. Every dependency that
# implies a managed service or a second host is a cost decision, not just a
# technical one.
dependencies = [
    "django>=5.2,<6.0",
    # PASSWORD_HASHERS lists Argon2 first (config/settings/base.py). Without
    # this package Django cannot hash or check a single password.
    "argon2-cffi>=23.1",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "django-storages[s3]>=1.14",
    "gunicorn>=22.0",
    "httpx>=0.27",
    # Vendor credentials are stored encrypted so an operator can rotate them
    # without a deploy — see apps/sources/credentials.py for what that does
    # and does not protect against. Also encrypts operator TOTP secrets.
    "cryptography>=43.0",
    # PRD §7.1's second factor for operators (apps/operations/totp.py).
    "pyotp>=2.9",
    # The model layer. `apps/enrichment/llm/client.py` imports it lazily, so
    # migrations and the portal run without it — but nothing can be enriched
    # until it is installed.
    "anthropic>=0.40",
    # Structured extraction is validated against Pydantic models server-side
    # (`messages.parse`), which is what keeps malformed claims out of the
    # database rather than parsing JSON and hoping.
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because the repo root holds several non-package directories
# (deploy/, scripts/, static/, templates/) and setuptools' flat-layout
# auto-discovery refuses to guess between multiple top-level packages.
[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    # Arch §4: the dependency rule is enforced here, not by review.
    "import-linter>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.ops"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = [
    # Arch §5.4 / §9.3: these four block deployment. Tagged so CI can assert
    # they ran, rather than trusting that a green suite included them.
    "tenancy: scope leakage, unscoped access, cross-plane escalation",
    "publication: the gate is the only door",
    # Opts a test out of the network block in conftest.py. Nothing uses it —
    # it exists so that the block is a choice rather than a wall.
    "live: makes real outbound HTTP calls",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by Django, not written by hand. Linting them means
# either reformatting machine output on every `makemigrations` or carrying a
# permanent wall of noise that hides the violations that matter.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.ops"
